<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PoultryPro - Poultry Smart</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7f6;
  color:#17231d;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:220px;
  height:100vh;
  background:#123b2a;
  color:white;
  padding:25px 15px;
}

.logo{
  font-size:22px;
  font-weight:bold;
  padding:0 10px;
  margin-bottom:8px;
}

.smart{
  color:#8ed35c;
  font-size:13px;
  padding:0 10px;
  margin-bottom:35px;
}

.menu{
  padding:13px 12px;
  margin:5px 0;
  border-radius:9px;
  cursor:pointer;
}

.menu:hover{
  background:#1d523b;
}

.main{
  margin-left:220px;
  padding:30px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.top h1{
  font-size:27px;
}

.top p{
  color:#748078;
  margin-top:5px;
}

.profile{
  background:white;
  padding:10px 15px;
  border-radius:25px;
  border:1px solid #e4e8e5;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.card{
  background:white;
  padding:22px;
  border-radius:15px;
  border:1px solid #e7ebe8;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.card-title{
  color:#77827c;
  font-size:14px;
}

.value{
  font-size:27px;
  font-weight:bold;
  margin-top:10px;
}

.green{
  color:#198754;
}

.content{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:18px;
  margin-top:20px;
}

.box{
  background:white;
  padding:22px;
  border-radius:15px;
  border:1px solid #e7ebe8;
}

.box h2{
  font-size:18px;
  margin-bottom:18px;
}

.batch{
  padding:15px;
  background:#f6f9f7;
  border-radius:10px;
  margin-bottom:10px;
}

.batch strong{
  color:#123b2a;
}

.quick button{
  width:100%;
  padding:13px;
  margin-bottom:10px;
  border:0;
  border-radius:9px;
  background:#123b2a;
  color:white;
  font-size:14px;
}

.quick button:hover{
  background:#1d523b;
}

@media(max-width:800px){

  .sidebar{
    width:70px;
    padding:20px 8px;
  }

  .logo{
    font-size:0;
    text-align:center;
  }

  .logo:first-letter{
    font-size:25px;
  }

  .smart{
    display:none;
  }

  .menu{
    font-size:0;
    text-align:center;
  }

  .main{
    margin-left:70px;
    padding:18px;
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .content{
    grid-template-columns:1fr;
  }

  .top h1{
    font-size:21px;
  }
}

@media(max-width:480px){

  .cards{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .card{
    padding:16px;
  }

  .value{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">🐔 PoultryPro</div>
  <div class="smart">Poultry Smart</div>

  <div class="menu">🏠 Dashboard</div>
  <div class="menu">🐔 My Farm</div>
  <div class="menu" onclick="batches()">🐔 Batches</div>
  <div class="menu">📝 Daily Entry</div>
  <div class="menu">🌾 Feed</div>
  <div class="menu">📉 Mortality</div>
  <div class="menu">💰 Rearing Charges</div>
  <div class="menu">📊 Reports</div>

</div>

<div class="main">

  <div class="top">

    <div>
      <h1>Good Evening, Farmer 👋</h1>
      <p>Here's your farm overview</p>
    </div>

    <div class="profile">
      👤 My Farm
    </div>

  </div>

  <div class="cards">

    <div class="card">
      <div class="card-title">Live Birds</div>
      <div class="value green">995</div>
    </div>

    <div class="card">
      <div class="card-title">Mortality</div>
      <div class="value">0.50%</div>
    </div>

    <div class="card">
      <div class="card-title">Feed Consumed</div>
      <div class="value">120 KG</div>
    </div>

    <div class="card">
      <div class="card-title">FCR</div>
      <div class="value">1.52</div>
    </div>

  </div>

  <div class="content">

    <div class="box">

      <h2>🐔 Active Batches</h2>

<div id="batchList">
  <p>Loading batches...</p>
</div>

    <div class="box quick">

      <h2>Quick Actions</h2>

      <button onclick="newBatch()">➕ New Batch</button>

      <button onclick="dailyEntry()">📝 Daily Entry</button>

      <button onclick="rearing()">💰 Rearing Charges</button>

      <button onclick="reports()">📊 View Reports</button>

    </div>

  </div>

</div>

<script>

function newBatch(){

  document.body.insertAdjacentHTML("beforeend",`

    <div id="batchForm"
      style="
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.45);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      z-index:9999;
      ">

      <div style="
        background:white;
        width:100%;
        max-width:500px;
        padding:25px;
        border-radius:18px;
        box-shadow:0 10px 40px rgba(0,0,0,.2);
      ">

        <h2 style="color:#123b2a;margin-bottom:8px;">
          🐔 Create New Batch
        </h2>

        <p style="color:#777;margin-bottom:20px;">
          Enter your batch details
        </p>

        <input placeholder="Company / Hatchery"
          style="width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;">

        <input placeholder="Batch Number"
          style="width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;">

        <input type="number" placeholder="Chicks Housed"
          style="width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;">

        <input type="number" placeholder="Chick Rate ₹"
          style="width:100%;padding:13px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;">

        <input type="date"
          style="width:100%;padding:13px;margin-bottom:18px;border:1px solid #ddd;border-radius:8px;">

        <button onclick="saveBatch()"
          style="
          width:100%;
          padding:14px;
          border:0;
          border-radius:9px;
          background:#123b2a;
          color:white;
          font-size:15px;
          ">
          Save Batch
        </button>

        <button onclick="document.getElementById('batchForm').remove()"
          style="
          width:100%;
          padding:12px;
          margin-top:8px;
          border:1px solid #ddd;
          border-radius:9px;
          background:white;
          ">
          Cancel
        </button>

      </div>
    </div>
  `);
}
async function saveBatch(){

  const inputs = document.querySelectorAll("#batchForm input");

  const company = inputs[0].value;
  const batch = inputs[1].value;
  const chicks = Number(inputs[2].value) || 0;
  const chickRate = Number(inputs[3].value) || 0;
  const date = inputs[4].value;

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/flocks",
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },
      body: JSON.stringify({
        farm_id: 1,
        batch_name: batch,
        bird_count: chicks,
        placement_date: date,
        status: "Active"
      })
    }
  );

  if(response.ok){
    alert("Batch saved successfully! 🐔");
    document.getElementById("batchForm").remove();
  }else{
    const error = await response.text();
    alert("Save failed: " + error);
  }
}
function dailyEntry(){
  alert("Daily Entry");
}

function rearing(){
  alert("Rearing Charges");
}

function reports(){
  alert("Reports");
}

const SUPABASE_URL = "https://bgbhdlzfxxlxsuteakir.supabase.co"
  const SUPABASE_KEY = "sb_publishable_Xah0jpqhtrM2v8AXy33BcQ_m8lsOPT_"
</script>
</body>
</html>
