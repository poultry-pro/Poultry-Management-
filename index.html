<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poultry RC Manager</title>

<style>
body{
font-family:Arial;
background:#f4f7f5;
margin:0;
}
header{
background:#16803c;
color:white;
padding:25px;
text-align:center;
}
.container{
padding:20px;
max-width:600px;
margin:auto;
}
.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:12px;
}
h2{
color:#16803c;
}
input{
width:100%;
padding:12px;
margin:8px 0 15px;
box-sizing:border-box;
}
button{
width:100%;
padding:14px;
background:#16803c;
color:white;
border:0;
border-radius:8px;
font-size:16px;
}
</style>
</head>

<body>

<header>
<h1>🐔 Poultry RC Manager</h1>
<p>Batch & Rearing Charges</p>
</header>

<div class="container">

<div class="card">
<h2>📋 Create New RC</h2>

<label>Farmer Name</label>
<input type="text" placeholder="Enter farmer name">

<label>Company / Hatchery</label>
<input type="text" placeholder="Enter company">

<label>Batch Number</label>
<input type="text" placeholder="Enter batch number">

<label>Chicks Housed</label>
<input type="number" placeholder="Enter chicks">

<label>Mortality</label>
<input type="number" placeholder="Enter mortality">

<label>Birds Sold</label>
<input type="number" placeholder="Enter birds sold">
  <label>Live Weight (KG)</label>
<input type="number" placeholder="Enter live weight">

<label>Feed Consumption (KG)</label>
<input type="number" placeholder="Enter feed consumption">

<label>Chick Cost (₹)</label>
<input type="number" placeholder="Enter chick cost">

<label>Feed Cost (₹)</label>
<input type="number" placeholder="Enter feed cost">

<label>Medicine Cost (₹)</label>
<input type="number" placeholder="Enter medicine cost">

<label>Vaccine Cost (₹)</label>
<input type="number" placeholder="Enter vaccine cost">

<label>Overhead / Other Cost (₹)</label>
<input type="number" placeholder="Enter other cost">

<button onclick="calculateRC()">📊 Calculate RC</button>

</div>

</div>

</body><script>
function calculateRC(){

  const inputs = document.querySelectorAll("input");

  const chicks = Number(inputs[3].value) || 0;
  const mortality = Number(inputs[4].value) || 0;
  const birdsSold = Number(inputs[5].value) || 0;
  const liveWeight = Number(inputs[6].value) || 0;
  const feed = Number(inputs[7].value) || 0;
  const chickCost = Number(inputs[8].value) || 0;
  const feedCost = Number(inputs[9].value) || 0;
  const medicine = Number(inputs[10].value) || 0;
  const vaccine = Number(inputs[11].value) || 0;
  const otherCost = Number(inputs[12].value) || 0;

  const mortalityPercent =
    chicks > 0 ? (mortality / chicks) * 100 : 0;

  const liveBirds = chicks - mortality;

  const fcr =
    liveWeight > 0 ? feed / liveWeight : 0;

  const totalCost =
    chickCost + feedCost + medicine + vaccine + otherCost;

  const costPerKg =
    liveWeight > 0 ? totalCost / liveWeight : 0;

  document.getElementById("result").innerHTML = `
    <h2>📊 Batch Result</h2>
    <p><b>Live Birds:</b> ${liveBirds}</p>
    <p><b>Mortality:</b> ${mortalityPercent.toFixed(2)}%</p>
    <p><b>FCR:</b> ${fcr.toFixed(3)}</p>
    <p><b>Total Production Cost:</b> ₹${totalCost.toFixed(2)}</p>
    <p><b>Production Cost / KG:</b> ₹${costPerKg.toFixed(2)}</p>
  `;

  document.getElementById("result").style.display = "block";
}
</script>
</html>
